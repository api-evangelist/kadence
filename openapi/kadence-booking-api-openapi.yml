components:
  schemas:
    Ulid-public_booking.check_out:
      type: object
      description: ''
      deprecated: false
    Booking-public_booking.check_out:
      type: object
      description: ''
      deprecated: false
      properties:
        id:
          readOnly: true
          externalDocs:
            url: https://schema.org/identifier
          description: The ULID of the booking.
          example: 01GTBV1CT3BM8A42SEJ2J5F4EG
          $ref: '#/components/schemas/Ulid-public_booking.check_out'
        createdUserId:
          readOnly: true
          description: The IRI of the user who created the booking.
          example: /v1/public/users/01GTBV1CT3BM8A42SEJ2J5F4EG
          anyOf:
          - $ref: '#/components/schemas/User-public_booking.check_out'
          - type: 'null'
        userId:
          readOnly: true
          description: The IRI of the user who the booking is for.
          example: /v1/public/users/01GTBV1CT3BM8A42SEJ2J5F4EG
          anyOf:
          - $ref: '#/components/schemas/User-public_booking.check_out'
          - type: 'null'
        space:
          readOnly: true
          type:
          - string
          - 'null'
          format: iri-reference
          example: https://example.com/
        startDate:
          readOnly: true
          type: string
          format: date-time
          description: The date and time of the beginning of the booking.
          example: '2017-07-21T17:32:28+00:00'
        endDate:
          readOnly: true
          type: string
          format: date-time
          description: The date and time of the end of the booking.
          example: '2017-07-21T17:32:28+00:00'
        createdAt:
          readOnly: true
          type: string
          format: date-time
          description: The date and time the booking was created at.
          example: '2017-07-21T17:32:28+00:00'
        updatedAt:
          readOnly: true
          type: string
          format: date-time
          description: The date and time the booking was last updated at.
          example: '2017-07-21T17:32:28+00:00'
        checkedInUserId:
          readOnly: true
          nullable: true
          description: The IRI of the user who checked into the booking.
          example: /v1/public/users/01GTBV1CT3BM8A42SEJ2J5F4EG
          anyOf:
          - $ref: '#/components/schemas/User-public_booking.check_out'
          - type: 'null'
        checkedInDate:
          readOnly: true
          type: string
          format: date-time
          description: The date and time the booking was checked in at.
          example: '2017-07-21T17:32:28+00:00'
        checkedInSource:
          readOnly: true
          type: string
          enum:
          - web
          - ios
          - android
          - calendar
          - publicApi
          - slack
          - msTeams
          - unknown
          description: The platform the booking was checked in from.
          example: web
        checkInMethod:
          readOnly: true
          type: string
          nullable: true
          enum:
          - doorAccess
          - wifi
          - geofence
          - sensor
          description: If checked in from the public API, the method used during check in.
          example: doorAccess
        checkOutMethod:
          readOnly: true
          type: string
          nullable: true
          enum:
          - doorAccess
          - wifi
          - geofence
          - sensor
          description: If checked out from the public API, the method used during check out.
          example: doorAccess
        checkedOutUser:
          readOnly: true
          nullable: true
          description: The IRI of the user who checked out of the booking.
          example: /v1/public/users/01GTBV1CT3BM8A42SEJ2J5F4EG
