          - unknown
          description: The platform the booking was checked out from.
          example: web
        permanent:
          readOnly: true
          type: boolean
          description: If this is a booking created from an assigned space.
          example: false
        hasGuests:
          readOnly: true
          type: boolean
          description: If this booking has guests.
