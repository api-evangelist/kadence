      type: object
      description: ''
      deprecated: false
      properties:
        numPassesAvailable:
          type:
          - integer
          - 'null'
          description: |-
            The number of passes available. If the building does not limit onsite availability, this will be null, unless
                        there is no availability for some other reason, in which case it will be 0.
          example: 25
        available:
          type: boolean
          description: Are there any available passes?
          example: true
        startDateTime:
          type: string
          format: date-time
          description: The date and time for the start of the pass.
          example: '2017-07-21T09:30:00+00:00'
        endDateTime:
          type: string
          format: date-time
          description: The date and time for the end of the pass.
          example: '2017-07-21T17:00:00+00:00'
        unavailabilityReason:
          type: string
          enum:
          - buildingClosure
          - openingHours
          - buildingClosed
          - noCapacity
          - unknown
          - null
          description: Why are no passes available. This will be null if there is availability
          example: buildingClosure
