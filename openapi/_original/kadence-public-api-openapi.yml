    Visitor-public_visitor:
      type: object
      description: |-
        Read-only public representation of a visitor.

        A visitor is a {@see BookingAttendee} viewed through the visits lens. This DTO serves two roles:
         1. As a top-level directory projection of visitors, where each entry carries a visit count and
            the context of its latest visit.
         2. As the embedded visitor type inside a visit (see the `public_visit` group), where only the
            core identity/attendance fields are serialised and the directory-only fields are omitted.

        The group split is deliberate: `public_visit` + `public_visitor` mark the core fields that appear
        in both roles, while `public_visitor` alone marks the directory-only fields (visit count + latest
        visit context) that must NOT leak into a visit's embedded `visitors[]` array.

        Every group name contains the substring `public` because the public OpenAPI doc command filters
        schema keys on that substring — a group without it is silently dropped from the generated spec.

        Deliberately NOT exposed: photoStorageRef, healthSelfCertifiedDate, invitationSentDate.

        The `/v1/public/visitors` collection + item operations read from a deduplicated (one row per lowercased
        email) directory of guest-booking attendees; the collection provider injects the visit count while the
        embedded-in-a-visit role (the `public_visit` group) leaves it null.
      deprecated: false
      properties:
        visitCount:
          description: The total number of visits this visitor has made. Null when embedded inside a visit.
