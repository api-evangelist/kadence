    Visitor.jsonld-public_visitor:
      type: object
      description: |-
        Read-only public representation of a visitor.

        A visitor is a {@see BookingAttendee} viewed through the visits lens. This DTO serves two roles:
         1. As a top-level directory projection of visitors, where each entry carries a visit count and
            the context of its latest visit.
         2. As the embedded visitor type inside a visit (see the `public_visit` group), where only the
            core identity/attendance fields are serialised and the directory-only fields are omitted.

        The group split is deliberate: `public_visit` + `public_visitor` mark the core fields that appear
        in both roles, while `public_visitor` alone marks the directory-only fields (visit count + latest
        visit context) that must NOT leak into a visit's embedded `visitors[]` array.

        Every group name contains the substring `public` because the public OpenAPI doc command filters
        schema keys on that substring — a group without it is silently dropped from the generated spec.

        Deliberately NOT exposed: photoStorageRef, healthSelfCertifiedDate, invitationSentDate.

        The `/v1/public/visitors` collection + item operations read from a deduplicated (one row per lowercased
        email) directory of guest-booking attendees; the collection provider injects the visit count while the
        embedded-in-a-visit role (the `public_visit` group) leaves it null.
      deprecated: false
      properties:
        '@context':
          readOnly: true
          oneOf:
          - type: string
          - type: object
            properties:
              '@vocab':
                type: string
              hydra:
                type: string
                enum:
                - http://www.w3.org/ns/hydra/core#
            required:
            - '@vocab'
            - hydra
            additionalProperties: true
        '@id':
          readOnly: true
          type: string
        '@type':
          readOnly: true
          type: string
        visitCount:
          description: The total number of visits this visitor has made. Null when embedded inside a visit.
          type: integer
          nullable: true
          example: 3
        id:
          readOnly: true
          externalDocs:
            url: https://schema.org/identifier
          description: The ULID of the visitor.
          example: 01GTBV1CT3BM8A42SEJ2J5F4EG
          $ref: '#/components/schemas/Ulid.jsonld-public_visitor'
        displayName:
          readOnly: true
          type: string
          nullable: true
          description: The display name of the visitor.
          example: John Smith
        firstName:
          readOnly: true
          externalDocs:
            url: https://schema.org/givenName
          type: string
          nullable: true
          description: The visitor's given name.
          example: John
        lastName:
          readOnly: true
          externalDocs:
            url: https://schema.org/familyName
          type: string
          nullable: true
          description: The visitor's family name.
          example: Smith
        email:
          readOnly: true
          externalDocs:
            url: https://schema.org/email
          type: string
          format: email
          description: The visitor's email address.
          example: john.smith@example.com
        type:
          readOnly: true
          type: string
          enum:
          - external
          - user
          description: Whether the visitor is an external guest or an internal Kadence user.
          example: external
        userId:
          readOnly: true
          nullable: true
          description: The internal Kadence user this visitor maps to, when the visitor is a user rather than an external guest.
          example: /v1/public/users/01GTBV1CT3BM8A42SEJ2J5F4EG
          anyOf:
          - $ref: '#/components/schemas/User.jsonld-public_visitor'
          - type: 'null'
        status:
          readOnly: true
          type: string
          enum:
          - none
          - organizer
          - tentatively_accepted
          - accepted
          - declined
          - not_responded
          description: The attendance status of the visitor.
