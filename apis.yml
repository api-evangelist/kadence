aid: kadence
name: Kadence
description: >-
  Kadence is a workplace management platform for hybrid work, helping organizations
  coordinate people, spaces, and workplace strategy through desk and room booking,
  visitor management, space management, and workplace analytics. Its Public API
  (OpenAPI 3.1, v1.2.0) lets applications read and manage buildings, floors,
  neighborhoods, spaces, bookings, check-ins and check-outs, users, visits, and
  visitors. The API is an API Platform (Hydra / JSON-LD) service secured with
  OAuth 2.0 client-credentials (scope "public"), with production hosts at
  api.onkadence.co and api.us.onkadence.co. Kadence was surfaced as a Techstars
  portfolio company and enriched into the API Evangelist network from its public
  developer surface.
